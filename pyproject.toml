[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-lyrics-ultimate"
version = "1.2.0"
description = "Cross-platform synchronized Spotify lyrics for Windows and Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7", "requests>=2.31"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
windows = ["winsdk>=1.0.0b10"]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.2"]

[project.scripts]
neolyrics = "neolyrics.cli:main"

[tool.setuptools.packages.find]
include = ["neolyrics*"]

[tool.setuptools.package-data]
"neolyrics" = ["assets/*.png"]
